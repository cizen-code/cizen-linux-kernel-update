"CPU_SUP_AMD"
"CPU_SUP_HYGON"
"CPU_SUP_CENTAUR"
"CPU_SUP_ZHAOXIN"
"X86_AMD_PSTATE"
"AMD_NB"
"AMD_NODE"
# Absorbidos por --absorb-rebels: Kconfig los conserva por dependencia.
"DEBUG_MEMORY_INIT"
# ---
# Absorbidos por --absorb-rebels: Kconfig los conserva por dependencia.
"BT_BCM"
"BT_RTL"
"BT_MTK"
"INTEL_SCU"
"INTEL_SCU_IPC"
"DW_DMAC_PCI"
"DW_DMAC_CORE"
"MPLS"
"DCB"
"LWTUNNEL"
"BLK_DEV_INTEGRITY"
"NETLABEL"
"NETWORK_SECMARK"
"PCI_IOV"
"APPLE_PROPERTIES"
"I2C_SLAVE"
"BOOT_CONFIG"
"PAGE_IDLE_FLAG"
# ---
# Absorbidos por --absorb-rebels: Kconfig los conserva por dependencia.
# v5.21.0: aquí estaban los 14 códecs HDA (ALC260/262/268/662/680/861/861VD/
# 880/882 + HDMI_SIMPLE/ATI/NVIDIA/NVIDIA_MCP/TEGRA), que v5.12.2 sacó de
# OPTS_DISABLE por no poder desactivarlos. No eran rebeldes por dependencia
# sino por promptless (`tristate … if EXPERT` con `default y`), y como en
# OPTS_DISABLE no estaban esta lista no servía para nada: el banco contaba
# 0 rebeldes esperados y ni los miraba. Ahora se podan de verdad (OPTS_DISABLE
# + EXPERT en OPTS_ENABLE) y de aquí salen; solo queda lo que sí se resiste.
"TDX_HOST_SERVICES"
# v5.16.1: KVM_INTEL lo selecciona sin condiciones en x86_64
# (arch/x86/kvm/Kconfig:99 -> `select X86_FRED if X86_64`). Con KVM obliged
# (KVM_SMM es CRITICAL) es imposible apagarlo, así que se tolera en vez de
# dejarlo cantando un DISABLE_WARN en cada build.
# v5.18.0: se suman dos IGUALES, verificados con olddefconfig contra 7.2.8:
#   - DRM_TTM: `select DRM_TTM` en drivers/gpu/drm/i915/Kconfig:40. Un `select`
#     no se puede rechazar, e i915 es obligatorio aquí, así que TTM se queda.
#   - KVM_COMPAT: `def_bool y` + `depends on KVM && COMPAT` en
#     virt/kvm/Kconfig:74. Con KVM puesto vale y siempre; la única forma de
#     quitarlo es apagar COMPAT (y con ella los binarios ELF de 32 bits).
"X86_FRED"
"DRM_TTM"
"KVM_COMPAT"
"WATCHDOG_PRETIMEOUT_GOV_SEL"
# ---
# v5.22.0 — rebeldes de las Fases P0/P2, medidos con `--check` sobre 7.2.9
# (CHECK EXITOSO: ENABLE 46/46, CRITICAL 13/13, SETVAL 30/30, DISABLE 374/377,
# estos 3 los únicos sin resolver). Siguen en OPTS_DISABLE: se pidió podarlos
# y aquí se documenta que Kconfig los devuelve a =y con una razón concreta.
# NO se fuerzan con --force (§10 anti-patrones) y tampoco se les cambia el
# valor: la validación pasa de "3 sin resolver" a "3 rebeldes esperados".
#   · MODULE_DEBUGFS: `bool` SIN prompt en kernel/module/Kconfig:26, o sea que
#     `scripts/config --disable` escribe pero `olddefconfig` lo vuelve a poner
#     desde su selector: MODULE_UNLOAD_TAINT_TRACKING (=y aquí) hace
#     `select MODULE_DEBUGFS` en kernel/module/Kconfig:153.
#   · STACKDEPOT: `bool` SIN prompt en lib/Kconfig:560 (y encima `select
#     STACKTRACE`), seleccionado por SLUB_DEBUG (=y) en mm/Kconfig.debug:52.
#     Sacarlo exigiría apagar SLUB_DEBUG, que no es del alcance.
#   · SCHED_SMT: `select SCHED_SMT if SMP` desde arch/x86/Kconfig:335 con
#     SMP=y. Es el caso que el §2 del procedimiento ya preveía ("Kconfig puede
#     conservarlo por infraestructura x86 SMP"); el i5-7500 no tiene
#     Hyper-Threading, así que es código que solo pesa, pero no se puede podar
#     por Kconfig.
"MODULE_DEBUGFS"
"STACKDEPOT"
"SCHED_SMT"
# C-3 (v5.23.0): AMD_MEM_ENCRYPT — presente en .config (confirmado /proc/config.gz) sin
# estar rastreado. Kaby Lake no tiene SME/SEV; el código de detección se ejecuta igual.
# Seleccionado por infraestructura x86 (X86_MEM_ENCRYPT). Impacto: ~µs de boot, inocuo.
"AMD_MEM_ENCRYPT"
# R-6 (v5.23.0): PCIE_DW y derivados — controladores PCIe Synopsys DesignWare (ARM/SoC).
# Presentes en .config sin hardware DW en Q270. Sin árbol fuente disponible para verificar
# selector exacto → tolerar aquí. Si confirmado independiente, mover a OPTS_DISABLE.
"PCIE_DW"
# ---
)
declare -A EXPECTED_REBEL_SET=()
for _r in "${EXPECTED_REBELS[@]}"; do EXPECTED_REBEL_SET["$_r"]=1; done
