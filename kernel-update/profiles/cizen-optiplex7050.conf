# controllers USB legacy (el Q270 no expone EHCI/OHCI/UHCI separado de xHCI).
# v5.3: recupera compatibilidad de escritorio, Wi-Fi de respaldo, cifrado, mandos/MIDI, RAPL y ZRAM multi-comp.
# v5: poda basada en hardware confirmado y uso real del equipo, con compatibilidad adicional solicitada.
# Se eliminan drivers/funciones claramente ajenos al equipo y debug opcional.
# NO se fuerzan fuera RCU, PSI, infraestructura genérica, ATA/BMDMA, CFG80211
# ni WIRELESS: su ahorro es pequeño y el riesgo de compatibilidad es mayor.
# Los host controllers USB legacy sí se retiran desde v5.4 (ver P1 más abajo):
# a diferencia de RCU/PSI/CFG80211, aquí no es "poco ahorro, riesgo alto"
