"USB_EHCI_HCD" "USB_EHCI_PCI" "USB_OHCI_HCD" "USB_OHCI_HCD_PCI" "USB_UHCI_HCD"
# Bluetooth USB confirmado: CSR 0a12:0001. Se conserva el stack BT USB.
