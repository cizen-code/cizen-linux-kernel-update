# v5.18.0 (2026-10-02): poda de "código de invitado" y de subsistemas muertos,
#   después de medir el arranque y el runtime de v5.17.0. Contexto medido:
#   - Arranque 18,45 s = 6,8 firmware + 3,7 loader + 1,2 kernel + 2,5 initrd +
#     4,3 userspace. El 57 % (10,5 s) está ANTES del kernel, así que el Kconfig
#     no puede mejorar el arranque global: solo/kernel 1,2 s e initrd 2,5 s.
#     graphical.target llega a los 4,28 s (systemd-analyze critical-chain).
#   - Scheduler/THP/C-states ya estaban al máximo (HZ_1000, PREEMPT_DYNAMIC con
#     preempt=lazy, RCU_BOOST, BORE, SCHED_AUTOGROUP, EPP performance,
#     intel_idle.max_cstate=4, THP=always, I/O none). No se toca nada de eso.
#   - Salen 8 símbolos. Ninguno aporta rendimiento medible: son código muerto o
#     de invitado, y el efecto es de TAMAÑO y superficie, no de velocidad. El
#     cambio de rendimiento real que queda por delante no es de Kconfig (ver
#     más abajo).
#   - Guest: HYPERVISOR_GUEST, KVM_GUEST, KVM_COMPAT. Esta máquina es
#     anfitriona (KVM_INTEL=m) y NUNCA invitada. Se compila el soporte de
#     sistemas invitados (paravirt de pagefault/preempt/spinlock alternos,
#     MSR de hypervisor) que no se ejecuta jamás. AVISO, cambio de
#     comportamiento: este kernel ya no arrancaría dentro de Xen/KVM como
#     invitado; como anfitrión no cambia nada. Si algún día hace falta, quitar
#     estas tres líneas y reconstruir.
#     KVM/KVM_X86/KVM_INTEL/KVM_SMM intactos: siguen compilando las VMs.
#   - KVM_COMPAT es el soporte de invitados x86-32. No hay ninguno (las VMs
#     usan la ISO de Arch x86-64). Si se usa un invitado 32 bits, revert.
#   - LIRC: raíz =y (heredada) y sin ningún driver hijo presente. Infrared
#     Remote Control está muerto desde 2017; este host no tiene mando IR.
#     Se pierde `ir-keytable`/`ir-remote` (nunca hubo nada que mapear).
#   - KSM: Kernel Samepage Merging, =y pero `run=0` (nunca activado). No hay
#     VMs ni carga que se beneficie de deduplicar páginas. Con 16 GiB y este uso,
#     el coste de KSM en reposo se paga sin retorno.
#   - TCG_TIS + TCG_CRB: TPM deshabilitado en BIOS (ver 01_inventario.md), así
#     que no hay a quién medirle el pulso. OJO: si se activa el TPM en la BIOS
#     para arranque medido, hay que quitar estas dos líneas y reconstruir;
#     mientras tanto, `systemd-cryptenroll` y los sellos PCR no tienen con qué
#     trabajar (ya era así con TPM apagado, esto solo quita el código).
#   - VERIFICADO CONTRA EL KCONFIG DE 7.2.8 (con `make olddefconfig`, no de
#     memoria): 6 de las 8 podas se aplican; las otras 2 son IMPOSIBLES y pasan
#     a EXPECTED_REBELS, igual que ya se hizo con X86_FRED y KVM_INTEL:
#       · DRM_TTM: `select DRM_TTM` en drivers/gpu/drm/i915/Kconfig:40. i915 es
#         el único driver de GPU de esta máquina y es obligatorio (además lo
#         exige el frag del firmware DMC), así que su `select` gana: no hay
#         ninguna forma de apagar TTM mientras haya i915. Comprobado en
#         experiments: ponerlo a n, y borrar la línea a mano del .config,
#         revive a =y en el siguiente olddefconfig los dos casos.
#       · KVM_COMPAT: `def_bool y` + `depends on KVM && COMPAT` en
#         virt/kvm/Kconfig:74. No es una opción: mientras KVM esté puesto
#         (obligatorio aquí, KVM_SMM es CRITICAL) vale y. La única palanca es
#         apagar COMPAT, que además arrastra IA32_EMULATION, COMPAT_BRK y
#         X86_X32: 16 símbolos y=m menos, a cambio de no poder ejecutar NINGÚN
#         binario ELF de 32 bits. DECIDIDO POR EL USUARIO (2026-10-02): NO se
#         apaga. Wine y MetaTrader 5 se usan en este host y tienen componentes
#         de 32 bits de verdad —77 paquetes lib32-* instalados, prefijos
#         ~/.wine y ~/.mt5, y ejecutables PE32 dentro de ambos—; quitar COMPAT
#         los rompería. Que conste en el perfil y no en la conversación: es el
#         tipo de decisión que una auditoría futura vuelve a plantear.
#   - Lo que NO se toca, y por qué (medido, no por fórmula):
#     · ZRAM: parece "sin uso" (swap 0 MiB) pero es una red de seguridad real.
#       Un zram registrado no reserva RAM hasta que se usa, y este host compila
#       con un tmpfs de 10 GiB sobre 16 GiB de RAM. Encender ZRAM cuesta 0.
#     · BT: ya es =m, o sea que NO se carga nunca. rfkill no lista ningún
#       dispositivo BT y no hay dongle, pero bluetooth.service está enabled y
#       active: apagar CONFIG_BT haría que BlueZ fallara al arrancar en cada
#       booteo (unidad roja en systemctl --failed) a cambio de nada medible.
#     · Mitigaciones: en 7.x son parámetros de RUNTIME, no de Kconfig
#       (MITIGATION_RETPOLINE/IBPB_ENTRY/IBRS_ENTRY/UNRET_ENTRY/ITS están =y
#       a nivel de compilación y el cmdline no las toca). Apagarlas es una
#       decisión de SEGURIDAD para el usuario, no una poda de perfil; medirlas
#       exige un segundo kernel contra el que comparar.
#     · MD, PSI, MODULE_SIG, STACKPROTECTOR_STRONG, RANDOMIZE_BASE, HUGETLBFS:
#       seguridad, red de rescate, o dependencias de las VMs/auditoría.
#   - Descartado: AGP (=y). Podría recortarse igual que DRM_TTM, pero sin el
#     árbol de fuentes no se puede comprobar que ningún driver superviviente lo
