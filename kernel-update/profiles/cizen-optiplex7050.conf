# Tomoyo, LoadPin, lockdown e INTEGRITY (que arrastra IMA, EVM,
# INTEGRITY_MACHINE_KEYRING, INTEGRITY_PLATFORM_KEYRING y LOAD_UEFI_KEYS).
# Sin nada en uso: /etc/apparmor.d vacío, sin security= en cmdline, lockdown [none].
# OJO: si se instala libvirt con sus perfiles AppArmor, quedarán INERTES sin
# avisar; este host virtualiza KVM. La firma de módulos aguanta porque
# MODULE_SIG_KEY="certs/signing_key.pem" (clave embebida, no la db de UEFI).
"SECURITY_SELINUX" "SECURITY_APPARMOR" "SECURITY_SMACK" "SECURITY_TOMOYO"
"SECURITY_LOADPIN" "SECURITY_LOCKDOWN_LSM" "SECURITY_SAFESETID"
"INTEGRITY"
#
# BLOQUE C — cuotas (CERRADO en v5.21.0; era "parcial, a conciencia").
#
# Hoy se apaga TODO lo de cuotas: TMPFS_QUOTA, XFS_QUOTA, GFS2_FS, OCFS2_FS y
# QUOTA. QUOTACTL se va con él (`bool` sin prompt, `default n`, solo lo
# levantan los `select` de abajo), así que no se lista y no genera ruido.
#
# Historia (lo que había que saber antes de v5.21.0): v5.19.0 apagaba
# QUOTA/QUOTACTL y Kconfig se los devolvía a =y desde distintos sitios según
# lo que traigara la BASE:
#     XFS_QUOTA   (fs/xfs/Kconfig:80)  select QUOTACTL
#     QUOTA       (fs/quota/Kconfig:8)  select QUOTACTL
#     GFS2_FS     (fs/gfs2/Kconfig:7)   select QUOTACTL   ← =m en /proc/config.gz
#     OCFS2_FS    (fs/ocfs2/Kconfig:8)  select QUOTA      ← idem
# Con la base promovida de 7.2.9 (sin símbolos XFS) se apagaban; con la de 7.2.8
# se apagaban; con /proc/config.gz —la base de fallback de una build de una
# versión nueva— NO, y salía `CONFIG_QUOTA=y CONFIG_QUOTACTL=y`. O sea que la
# receta de "los tres juntos o nada" era una lista de síntomas, no de raíces, y
# solo cerraba con algunas bases. Dejarlo así daba un WARNING en cada build cuya
# base variase, que es justo lo que un perfil no debe hacer.
#
# Se podría cerrar del todo añadiendo GFS2_FS y OCFS2_FS a la poda (son
# filesystems de clúster, tan ajenos a este host como los JFFS2/UBIFS/ROMFS que
# el perfil ya poda), pero eso AMPLÍA la poda a dos subsistemas que no pedía
# este cambio. Ante esa elección se relaja la optimización y se dice: se
# prefiere dejar dos capas VFS de un par de decenas de KiB antes que podar dos
# filesystems que nadie pidió podar. /home va con `noquota` y no hay `quota`
# instalado, así que con QUOTA/QUOTACTL =y no ocurre nada observable.
#   · v5.21.0 (2026-10-06): esa elección se revierte — el usuario la decidió
#     (§62.7) y se cierra del todo. Se podan GFS2_FS y OCFS2_FS, y con ellos
#     QUOTA (los tres motivos que v5.20.0 no podía tocar quedan fuera). Ver la
#     cabecera v5.21.0 y el comentario que acompaña a los tres símbolos justo
#     debajo: el resultado pasa a no depender de la base.
"GFS2_FS" "OCFS2_FS" "QUOTA"
"TMPFS_QUOTA"
# Sub-símbolos de XFS que se apagan para que el resultado NO dependa de la base.
# Sin esto, `olddefconfig` conserva el valor que traiga la base: medido con las
# tres bases (ver v5.20.0 de la cabecera), /proc/config.gz —el LTS— los deja =y
# y las bases promovidas de Cizen los dejaban =n. O sea que el mismo perfil daba
# dos kernels distintos según la base, que es justo lo que §57.7 reprobó de los
# bancos de Kconfig.
"XFS_SUPPORT_V4" "XFS_SUPPORT_ASCII_CI" "XFS_RT" "XFS_QUOTA"
#   · XFS_SUPPORT_V4: /home es `crc=1` (xfs_info), o sea V5. El soporte del
#     formato V4 (crc=0) está deprecado desde 2025 y es superficie de ataque.
#   · XFS_SUPPORT_ASCII_CI: su propio help dice que activarlo "hace vulnerable a
#     XFS a ataques de sensibilidad a mayúsculas", y /home va `ascii-ci=0`.
#   · XFS_RT: /home va `realtime=none`; son dispositivos realtime, no un /home.
#   · XFS_QUOTA: además de ser código de cuota que no se usa (/home `noquota`,
#     sin `quota` instalado), es una de las raíces que devuelven QUOTACTL a =y.
# Lo que NO se toca: XFS_POSIX_ACL (=y, en OPTS_ENABLE) y los
# XFS_ONLINE_SCRUB/REPAIR/DRAIN_INTENTS/LIVE_HOOKS, que salen =y por default y
# son los que hacen útiles `xfs_scrub` y `xfs_repair` en caliente.
# NO se listan (y por qué), para que nadie los "arregle" después:
#   · AUTOFS_FS: rompe /proc/sys/fs/binfmt_misc (automount de systemd) y con él
#     el handler DOSWin de Wine. Ver la cabecera v5.19.0.
#   · IMA, EVM, PM_WAKELOCKS y casi todo el Bloque C y el D: ya estaban apagados.
#   · SYSV_FS, REISERFS_FS, IP_DCCP, CAIF, ISDN, HAMRADIO, IRDA: no existen en
#     7.2.9. Listarlos solo daría ruido de "símbolo inexistente" cada build.
# ── v5.22.0 P0: ligereza estructural (RT-Lite, gate §1 = APLICA) ─────────────
# MAXSMP dimensiona máscaras de CPU, arrays per-CPU, RCU, scheduler e IRQ para
# 8192 CPUs; aquí hay 4C/4T. Con MAXSMP=n baja NR_CPUS a 8 (OPTS_SETVAL, ver
# más abajo): menos memoria de estructuras per-CPU y menos recorrido, sin
# tocar funcionalidad (no hay hotplug real que exija más). El orden de
# aplicación del motor garantiza que MAXSMP cae ANTES de fijar NR_CPUS.
# DYNAMIC_DEBUG/MODULE_DEBUGFS/X86_CPA_STATISTICS/STACKDEPOT/PCSPKR_PLATFORM
# son código de diagnóstico: el perfil ya apagó ftrace y BTF, y ninguno de los
# seis está en el listado de intocables §0.4.
"MAXSMP"
"DYNAMIC_DEBUG"
"MODULE_DEBUGFS"
"X86_CPA_STATISTICS"
"PCSPKR_PLATFORM"
"STACKDEPOT"
# ── v5.22.0 P1: rescate/auditoría/accounting no usados (gate §1 = NO) ───────
# Los 16 solo entraron porque el gate confirmó "=y en config" Y "NO en
# runtime": sin binario kexec, sin crashkernel=, auditd inactive, acct sin
# arrancar, rules.d vacío y sin security=/lockdown en el arranque. Si algún día
# se activa auditd o se pasa a usar kexec, hay que quitar de aquí lo que vuelva
# a usarse. Nada de esto es intocable §0.4.
# CASCADE conocida y aceptada (§3 del procedimiento): con AUDIT=n los hooks de
# auditctl quedan inertes (irrelevante en este desktop sin auditd) y las
# métricas de retardo de `perf sched latency` dejan de rellenarse.
"KEXEC" "KEXEC_FILE" "KEXEC_SIG" "KEXEC_BZIMAGE_VERIFY_SIG" "KEXEC_CORE"
"KEXEC_HANDOVER"
"CRASH_DUMP" "CRASH_RESERVE" "CRASH_HOTPLUG" "VMCORE_INFO"
"AUDIT" "AUDITSYSCALL"
"BSD_PROCESS_ACCT" "BSD_PROCESS_ACCT_V3"
"TASKSTATS" "TASK_DELAY_ACCT"
# ── v5.22.0 P2 (EXPERIMENTAL): heurísticas que restan determinismo RT ───────
# Aplicada a petición del usuario junto con P0+P1 (§5). Conlleva la edición de
# CRITICAL_OPTS: SCHED_AUTOGROUP sale de ahí y se poda aquí, o la validación
# reportaría un crítico insatisfecho.
#   · SCHED_AUTOGROUP: agrupa por sesión (bueno para desktop); se acepta el
#     coste en determinismo. Si el escritorio se siente peor, se revierte aquí
#     y se devuelve a CRITICAL_OPTS.
#   · SCHED_SMT: el i5-7500 NO tiene Hyper-Threading → código muerto.
#   · X86_USER_SHADOW_STACK: Kaby Lake no tiene CET/User Shadow Stack.
#   · REMOTEPROC/REMOTEPROC_CDEV: remoteproc no se usa en este host.
#   · RT_GROUP_SCHED: ya viene n en 7.2.9 (el grep del gate no lo encontró);
#     se lista igual para anclar la intención. `kernel.sched_rt_runtime_us=-1`
#     del sysctl queda entonces inerte, que es lo que documenta §4.2.
"SCHED_AUTOGROUP"
"RT_GROUP_SCHED"
"SCHED_SMT"  # → rebelde confirmado en EXPECTED_REBELS: `select SCHED_SMT if SMP` (arch/x86/Kconfig:335).
"X86_USER_SHADOW_STACK"
"REMOTEPROC"
"REMOTEPROC_CDEV"
) # v5.12.1: se retira LEDS_CLASS_MULTICOLOR de la poda — el driver de mandos
  # PS4/PS5 (HID_PLAYSTATION=m, exigido aquí) tenía `depends on
  # LEDS_CLASS_MULTICOLOR`; con él desactivado el símbolo quedaba `missing` y la
  # validación FATAL. Se conserva así el soporte de mandos (hid-playstation,
  # hid-sony, hid-nintendo, hid-steam, xpad, joydev, uhid, hidp) aunque ahora
  # mismo no haya ningún mando conectado (el allowlist del podador ya los
  # mantiene).
# ============================================================
# HARDWARE CONFIRMADO PARA v5.4
# ============================================================
# CPU: Intel Core i5-7500 / Kaby Lake-S / 4C4T
# GPU: Intel HD Graphics 630 [8086:5912] / i915
# Audio: Intel HDA [8086:a2f0], codec Realtek ALC3234 + Intel Kabylake HDMI
# Ethernet: Intel I219-LM [8086:15e3] / e1000e
# SATA: Intel 200 Series AHCI [8086:a282]
# Bluetooth: Cambridge Silicon Radio USB [0a12:0001]
# USB: xHCI + Kingston DataTraveler USB 3.x; mouse/keyboard HID
# Virtualización: KVM Intel activo; KVM_SMM requerido
# FS: Btrfs; zram activo con ZSTD
#
# Decisiones v5.4 (fase P1 de cizen-v4-matriz-maestra.txt):
# - CPU_SUP_AMD/HYGON/CENTAUR/ZHAOXIN, X86_AMD_PSTATE, AMD_NB, AMD_NODE,
#   KVM_AMD: fuera. La nota de v5.3 ya decía "AMD P-state y CPUs
#   AMD/Hygon/Centaur/Zhaoxin: fuera", pero esos símbolos nunca habían
#   llegado a OPTS_DISABLE; esta versión corrige esa discrepancia.
# - Ethernet Intel no presente (E100, E1000, IGB/IGBVF, IGC, IXGBE/VF,
#   I40E/VF, ICE, FM10K, IDPF): fuera. Solo e1000e/I219-LM es real aquí.
# - Host controllers USB legacy (EHCI/OHCI/UHCI): fuera. El Q270 no expone
#   ese hardware por separado de xHCI; a diferencia de RCU/PSI/CFG80211,
#   aquí no es "poco ahorro, riesgo alto" sino hardware inexistente.
# - KVM_MAX_NR_VCPUS: 1024 -> 8. Host de 4 núcleos; 8 vCPUs por invitado
#   ya es holgado, sin mantener el límite por defecto pensado para hosts
#   de servidor grandes.
#   * CORRECCIÓN v5.6.1: Kconfig no permite bajar de 1024 (range 1024 4096).
#     Se revierte a 1024 para evitar el error FATAL de kcheck.
# - Deliberadamente NO tocado en esta fase: ISO9660/UDF, códecs HDA por
#   fabricante y drivers Dell WMI/SMBIOS quedan igual — estos últimos,
#   además, resultaron SÍ estar cargados (`lsmod`: dell_wmi, dell_smbios,
#   dell_wmi_aio), así que la sugerencia de podarlos queda descartada, no
#   solo pendiente. (EXT4, mencionada aquí como no tocada en v5.4/v5.5, se
#   retiró en v5.6 — ver más abajo.)
#
# Decisiones v5.6 (evidencia de kernel-profile-v3.txt + confirmación directa):
# - EXT4_FS: fuera. lsblk/blkid/findmnt (secciones 07/08) muestran que todo
#   el almacenamiento presente es Btrfs (disco interno, /dev/sda2) o
#   exFAT/FAT16 (USB Ventoy, /dev/sdb1-2); ningún ext4 en ningún dispositivo
#   conectado. Confirmado con el usuario antes de aplicar.
#
# Decisiones v5.6.1 (corrección de validación kcheck):
# - KVM_MAX_NR_VCPUS: se corrige de 8 a 1024. Kconfig impone un rango
#   estricto de 1024 a 4096 para x86. Intentar forzar 8 causaba un error
#   FATAL en la validación de kcheck.
# - CPU_SUP_AMD y relacionados: se mueven de OPTS_DISABLE a EXPECTED_REBELS.
#   Kconfig las conserva (=y) por dependencias ocultas de la arquitectura,
#   lo que generaba 7 advertencias (⚠) en cada ejecución.
#
# Decisiones v5.6.2:
# - CGROUP_BPF: pasa de OPTS_DISABLE a OPTS_ENABLE. systemd adjunta programas
#   eBPF a cgroups para su firewall/contabilidad; desactivado generaba el
#   aviso de systemd en cada arranque. IPV6_SEG6_BPF y LWTUNNEL_BPF siguen
#   desactivados: no afectan al firewall de cgroups.
#
# Decisiones v5.7.0 (Grupo 1 — últimos restos medibles de config):
# - TICK_CPU_ACCOUNTING: se habilita (OPTS_ENABLE) y VIRT_CPU_ACCOUNTING_GEN
#   se desactiva. El accounting por vtime (gancho en cada context-switch) solo
#   hace falta con NO_HZ_FULL, que este host no usa (NO_HZ_IDLE + HZ_1000).
# - IRQ_TIME_ACCOUNTING: se rehabilita en v5.10.0 (OPTS_ENABLE) para
#   alimentar a EEVDF con contabilidad IRQ precisa por tarea; el coste es un
#   contador por IRQ, despreciable en 4C/4T.
# - ENERGY_MODEL: modelo de energia de EAS, solo util en CPUs big.LITTLE/
#   hybrid (Alder Lake+). i5-7500 es 4x identico -> codigo muerto.
#   * NOTA v5.7.0: si Kconfig se la mantiene por algun select interno,
#     mover a EXPECTED_REBELS igual que se hizo con CPU_SUP_AMD.
# - DEBUG_MEMORY_INIT / DEBUG_WX: debugging de init de memoria y respagina
#   W+X, ambos solo activos al arrancar; sin utilidad permanente en este
#   perfil. Nada que ver con FORTIFY/HARDENED_USERCOPY (esos se mantienen).
# - cmdline (NO es config): recomendar anadir nmi_watchdog=0 a
#   /etc/kernel/cmdline (evita IPIs periodicos del NMI watchdog en desktop).
#
# Decisiones v5.5 (fase P2 de cizen-v4-matriz-maestra.txt — WLAN):
# - WLAN + los 18 WLAN_VENDOR_*: fuera. Confirmado por dos vías: (1) el
#   usuario indicó que solo usa Ethernet, no Wi-Fi; (2) kernel-profile-v3.txt
#   no muestra ningún controlador inalámbrico en los 13 dispositivos PCI
#   (sección 05) ni ninguna interfaz wlan*/wlp* en `ip -br link` (sección 09)
#   — solo lo/lan0(e1000e)/virbr0. CFG80211/WIRELESS se conservan intactos,
#   sin cambio respecto a v5.3/v5.4.
#
# Decisiones v5.3:
# - AMD P-state y CPUs AMD/Hygon/Centaur/Zhaoxin: fuera.
# - BT USB se conserva; sólo se eliminan backends BT no presentes.
# - Realtek ALC269 se conserva porque ALC3234 usa ese driver en este sistema;
#   no se elimina SND_HDA_CODEC_ALC269.
# - Intel HDMI HDA se conserva para la GPU integrada.
# - USB_STORAGE/UAS/HID y xHCI se conservan.
# - KVM/KVM_INTEL/KVM_SMM se conservan.
# - No se cambia IRQ affinity ni i915 por observación en reposo.
# - Se recuperan funciones de compatibilidad solicitadas en la revisión v5.
# - RAPL se activa como módulo y ZRAM_MULTI_COMP como funcionalidad del perfil.
# - GamePadPlus V3 / HID Bluetooth: UHID, BT_HIDP e INPUT_JOYDEV como módulos.
# ============================================================
# Valores exactos v5.3 (incluye modos y valores numéricos).
# Evidencia usada para v5.3: ejecución real de kcheck 7.2.3 registró 33 DISABLE
# conservados por Kconfig. Se dejan fuera del perfil porque insistir en ellos no
# cambia la configuración efectiva y solo genera ruido de auditoría.
declare -A OPTS_SETVAL=(
# KVM: Kconfig impone un rango estricto (range 1024 4096) para x86.
# Aunque el host tiene 4 núcleos y 8 vCPUs sería ideal, no podemos bajar
# de 1024 sin parchear el código fuente del kernel. Se fija al mínimo permitido.
["KVM_MAX_NR_VCPUS"]="1024"
["SERIAL_8250_NR_UARTS"]="8"
["SERIAL_8250_RUNTIME_UARTS"]="8"
["SND_MAX_CARDS"]="8"
["VGA_ARB_MAX_GPUS"]="2"
["SND_HDA_POWER_SAVE_DEFAULT"]="0"
# v5.14.0: LPM de SATA a 0 (antes el default 3 = ahorro maximo). Es un int con
# range 0 5 y depends on SATA_AHCI (drivers/ata/Kconfig:118). En un SSD SATA
# de escritorio el ahorro no compensa la latencia de salida de partial/slumber.
# Se compensa por unidad montada, no global: el arbol no carga ahci.ko (built-in
# con SATA_MOBILE_LPM_POLICY=0 ya compilado), asi que el default del kernel se
# aplica solo y no hace falta un modprobe.d override.
["SATA_MOBILE_LPM_POLICY"]="0"
["BLK_DEV_LOOP"]="m"
["BLK_DEV_LOOP_MIN_COUNT"]="8"
["PSI"]="y"
["PSI_DEFAULT_DISABLED"]="n"
["ISO9660_FS"]="m"
["MD"]="y"
["INPUT_JOYSTICK"]="y"
["JOYSTICK_XPAD"]="m"
["JOYSTICK_XPAD_FF"]="y"
["HID_SONY"]="m"
["HID_PLAYSTATION"]="m"
["HID_NINTENDO"]="m"
["HID_STEAM"]="m"
["SND_SEQUENCER"]="m"
["SND_SEQ_DUMMY"]="m"
# INTEL_RAPL/CORE = driver de power-capping (powercap/intel_rapl), NO es PERF_EVENTS_INTEL_RAPL
# (interfaz PMU de `perf`, que está en OPTS_DISABLE). Son símbolos completamente distintos.
["INTEL_RAPL"]="m"
["INTEL_RAPL_CORE"]="m"
["ZRAM_MULTI_COMP"]="y"
["UHID"]="m"
["BT_HIDP"]="m"
["INPUT_JOYDEV"]="m"
# v5.22.0 (Fase 1/P0): dimensionar para 4C/4T con margen (8) en vez de 8192.
# Requiere MAXSMP=n (en OPTS_DISABLE); el motor manda los --disable antes que
# los --set-val, así que el orden de escritura es el correcto (§6.3 del doc).
# Tras olddefconfig se comprueba en la verificación post-build: si NR_CPUS
# sigue 8192 es que MAXSMP no cayó.
["NR_CPUS"]="8"
# HZ=1000 es redundante con HZ_1000 en OPTS_ENABLE (mismo choice de Kconfig).
# Se conserva como ancla explícita de auditoría: si la base cambia el choice, esto lo fija también.
["HZ"]="1000"
)
# Valores de texto
declare -A OPTS_SETSTR=(
["DRM_I915_FORCE_PROBE"]=""
["DRM_PANIC_SCREEN"]="user"
# O-4 (v5.23.0): anclar TRANSPARENT_HUGEPAGE_SHMEM/TMPFS a never para que el resultado
# no dependa de la base. THP global = always, pero forzar hugepages en shmem/tmpfs
# desperdiciaría memoria en el tmpfs de build (10 GiB, objetos pequeños del compilador).
["TRANSPARENT_HUGEPAGE_SHMEM_HUGE"]="never"
["TRANSPARENT_HUGEPAGE_TMPFS_HUGE"]="never"
)
# v5.3 aplicado: WLAN se fija explícitamente como ENABLE; se retiran del perfil los DISABLE que Kconfig 7.2.3 demostró conservar por dependencia/select/default.
# CRÍTICOS: no se pueden saltar con --force.
declare -a CRITICAL_OPTS=(
"NO_HZ_IDLE"
"PREEMPT_DYNAMIC"
"X86_NATIVE_CPU"
"BTRFS_FS"
"XFS_FS"
"DRM_I915"
"SND_HDA_INTEL"
"E1000E"
# v5.22.0: SCHED_AUTOGROUP sale de CRITICAL_OPTS porque la Fase 4/P2 lo poda
# (está ahora en OPTS_DISABLE). Dejarlo aquí haría que validate_config reportara
# un crítico insatisfecho. Si se revierte P2, vuelve a esta lista.
"LRU_GEN_ENABLED"
"NET_SCH_INGRESS"
"NET_ACT_CSUM"
"DEFAULT_BBR"
"KVM_SMM"
)
# Rebeldes observados y razonables: NO son errores si Kconfig los mantiene.
