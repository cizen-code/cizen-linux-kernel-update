# v5.20.0 (2026-10-03): XFS pasa de "poda" a OBLIGATORIO (=y built-in).
#   /home es XFS de verdad (`findmnt /home` → /dev/sda3 xfs, `xfs_info` →
#   crc=1, ascii-ci=0, realtime=none) y este host arranca por UKI verificado,
#   sin initramfs que cargue xfs.ko a tiempo. Con XFS_FS apagado el kernel no
#   monta /home. Cambio: XFS_FS y XFS_POSIX_ACL a OPTS_ENABLE, XFS_FS a
#   CRITICAL_OPTS, y XFS_FS FUERA de OPTS_DISABLE (Bloque C), que es lo que lo
#   apagaba en cada build desde v5.19.0.
#   Por qué `=y` y no `=m`: XFS_POSIX_ACL es `bool depends on XFS_FS`, así que
#   con XFS_FS=m Kconfig lo degrada a n. XFS_POSIX_ACL=y y XFS_FS=m son
#   incompatibles, y sin initramfs es built-in además lo que corresponde.
#   Corrige tres cosas que v5.19.0 daba por buenas, las tres medidas contra el
#   Kconfig real de 7.2.9 (scripts/config + make olddefconfig):
#     · el `select QUOTACTL` de fs/xfs/Kconfig:80 es de XFS_QUOTA, NO de
#       XFS_FS, y QUOTA/QUOTACTL los devuelven además GFS2_FS (=m en
#       /proc/config.gz) y OCFS2_FS. Por eso salen de la poda: see BLOQUE C.
#       (v5.21.0 sí los poda ya, con GFS2/OCFS2: ver arriba.)
#     · XFS_SUPPORT_V4 y XFS_SUPPORT_ASCII_CI son `default n` desde 7.2.9, pero
#       "default" no es "garantizado": olddefconfig CONSERVA el =y que traiga la
#       base, y /proc/config.gz los traía. Se fijan a n explícitamente, igual
#       que XFS_RT y XFS_QUOTA, para que el kernel no dependa de la base.
#     · los sub-símbolos de XFS quedaban =y con una base y =n con otra: el
#       mismo perfil producía dos kernels distintos.
#   Verificado con `kconfig-validate.sh` (mismo método que v5.16.1/v5.19.0) con
#   LAS TRES bases que puede usar una build — la promovida de 7.2.8, la
#   promovida de 7.2.9 y /proc/config.gz — y con las tres sale lo mismo:
#   37/37 ENABLE, 14/14 CRITICAL, 320/320 DISABLE, 0 sin resolver, 0 FATAL, y
#   un bloque XFS idéntico: XFS_FS=y, XFS_POSIX_ACL=y, FS_POSIX_ACL=y,
#   XFS_SUPPORT_V4/ASCII_CI/RT/QUOTA =n, y los XFS_ONLINE_SCRUB/REPAIR/
#   DRAIN_INTENTS/LIVE_HOOKS =y por default (xfs_scrub y xfs_repair en caliente).
#   Lo que NO se apaga y sí se perdía: TMPFS_QUOTA se apaga (es la raíz de
#   QUOTA de verdad), pero QUOTA y QUOTACTL se quedan =y en las bases que
#   los fuerzan. /home va con `noquota` y no hay `quota` instalado.
#   (v5.21.0 cierra eso también: GFS2/OCFS2/QUOTA a la poda.)
