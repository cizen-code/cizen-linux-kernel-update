# NO se pone "DEBUG_INFO_BTF" en esta lista, y es deliberado. En el modo normal
# del motor (BTF_REQUESTED=true) el motor hace add_unique enable DEBUG_INFO_BTF
# (kernel-update.sh:1639) DESPUES de merger el perfil (1566/1571), y un simbolo
# en las dos listas dispara la resolucion de conflictos de add_unique, que
# llama a eff_remove... que no existe todavia: se define en la 6459 y add_unique
# en la 1528. En bash una funcion tiene que existir antes de invocarse, asi que
# la rama revienta con
#     line 1538: eff_remove: orden no encontrada   -> Error 127, build abortado
# Es un bug de orden del motor, no de este perfil, y esta es la primera
# combinacion que lo dispara. Por eso BTF se apaga con el opt-out del motor
# (--no-btf / CIZEN_NO_BTF=1) y no desde aqui. Aun asi, olvidar el flag se ve:
# DEBUG_INFO_REDUCED (OPTS_ENABLE) vuelve BTF inalcanzable por dependencia, asi
# que la validacion reporta CONFIG_DEBUG_INFO_BTF sin satisfacer.
# SCHED_CLASS_EXT cae aqui porque depende de DEBUG_INFO_BTF (Kconfig.preempt:171)
# y, con BORE, no puede coexistir de todos modos.
