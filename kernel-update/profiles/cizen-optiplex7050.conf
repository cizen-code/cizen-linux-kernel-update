# ── v5.16.1: opciones verificadas con `make olddefconfig` sobre linux-7.2.8 ──
# Todo lo que sigue se comprobó de verdad: se aplicó con scripts/config sobre el
# .config generado, se normalizó con `make olddefconfig` y se releyó el
# resultado replicando el validate_config() del motor (ENABLE 35/35, CRITICAL
# 13/13, DISABLE 318/318, 0 DISABLE_WARN). Dos criterios:
#   1) Solo se listan las RAÍCES. Kconfig cascada a los hijos, y listarlos
#      uno a uno los convierte en "RETIRED/símbolo inexistente" al validarlos
#      (ruido en cada build). Se comprobó que la lista de raíces produce un
#      .config IDÉNTICO byte a byte a la lista con los hijos incluidos.
#   2) Un símbolo que Kconfig no deja apagar NO se lista aquí (sería un
#      DISABLE_WARN eterno): se documenta y va a EXPECTED_REBELS.
#
# Xen: 28 símbolos CONFIG_XEN*=y. Este host usa KVM/QEMU como hipervisor, no es
# guest de Xen ni dom0 (`/proc/xen` no existe), así que el subsistema Xen es
# peso muerto. Con la raíz basta: caen XEN_PVH, XEN_HYPERVISOR y
# X86_XEN_HYPERVISOR (los dos últimos ya venían en n: son para DENTRO de Xen).
"XEN"
# Intel TDX: Kaby Lake (i5-7500) no tiene TDX en hardware, y el propio Kconfig
# lo pone `default y` ("If unsure, say N", arch/x86/kvm/Kconfig:136).
# OJO al orden de la cascada: la raíz NO es KVM_INTEL_TDX sino INTEL_TDX_HOST,
# porque la relación es `config KVM_INTEL_TDX depends on INTEL_TDX_HOST`.
# Apagando solo KVM_INTEL_TDX, TDX_HOST_SERVICES se quedaba en =m (peor que
# =y: TDX como módulo arrastra su soporte) y salía ARCH_KEEP_MEMBLOCK=y.
# Apagando INTEL_TDX_HOST caen los tres, y con ellos se resuelve el
# "rebel" TDX_HOST_SERVICES que venía tolerándose desde v5.12.2.
"INTEL_TDX_HOST"
