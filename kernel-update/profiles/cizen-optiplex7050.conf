# v5.8: añade MODULE_SIG_FORCE — módulos ya firmados sha512/ECDSA, se fuerza la
# verificación de firma en carga (bloquea módulos no firmados; coste ≈ 0).
# v5.10.0 (2026-09-19, decisión del usuario):
# - HZ_1000 en vez de HZ_300 (timers de 1 ms → menor latencia de scheduler en
#   input/audio/gaming; coste despreciable en 4C con NO_HZ_IDLE). Se activa el
#   símbolo HZ_1000 y se fija OPTS_SETVAL["HZ"]="1000"; se retira HZ_1000 de
#   OPTS_DISABLE y HZ_300 de OPTS_ENABLE (exitía en ambos bloques).
# - IRQ_TIME_ACCOUNTING: de OPTS_DISABLE (v5.7.0) a OPTS_ENABLE — contabilidad
#   IRQ por tarea para decisiones EEVDF más finas en desktop.
# - x86-64-v3: NO aplica cambio. Ya compilamos con CONFIG_X86_NATIVE_CPU=y,
#   equivalente a -march=native para la máquina de build, que produce código
#   AVX2/bmi2 (x86-64-v3) o mejor según gcc. Cambiar a GENERIC_CPU3 fijaría
#   -march=x86-64-v3 fijo y perdería scatter de generaciones futuras; native es
#   el superconjunto correcto aquí.
# v5.9: poda de compat de almacenamiento no usada (2026-09-18) — se retiran
# ntfs3, udf, overlayfs, dm-crypt y dm-mod. Verificado en el host: 0 blkid con
# NTFS/LUKS/LVM, sin docker/podman (overlayfs), sin discos UDF. Se conservan
# exfat/vfat (USB Ventoy) e iso9660 (ISO boot/rescate; el booteo desde Ventoy
# no depende de este kernel). Eran módulos m (OPTS_SETVAL) nunca cargados en
# este host: moverlos a OPTS_DISABLE quita disco/initramfs sin coste de runtime.
# v5.4: aplica fase P1 de cizen-v4-matriz-maestra.txt — exclusividad de
# vendor en CPU/KVM/Ethernet, límite de KVM_MAX_NR_VCPUS y retiro de host
# controllers USB legacy (el Q270 no expone EHCI/OHCI/UHCI separado de xHCI).
# v5.3: recupera compatibilidad de escritorio, Wi-Fi de respaldo, cifrado, mandos/MIDI, RAPL y ZRAM multi-comp.
# v5: poda basada en hardware confirmado y uso real del equipo, con compatibilidad adicional solicitada.
# Se eliminan drivers/funciones claramente ajenos al equipo y debug opcional.
# NO se fuerzan fuera RCU, PSI, infraestructura genérica, ATA/BMDMA, CFG80211
# ni WIRELESS: su ahorro es pequeño y el riesgo de compatibilidad es mayor.
# Los host controllers USB legacy sí se retiran desde v5.4 (ver P1 más abajo):
# a diferencia de RCU/PSI/CFG80211, aquí no es "poco ahorro, riesgo alto"
# sino hardware que este chipset concreto no expone.
