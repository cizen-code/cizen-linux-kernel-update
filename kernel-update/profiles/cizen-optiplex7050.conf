"X86_MCE_AMD" "PERF_EVENTS_AMD_POWER" "PERF_EVENTS_AMD_UNCORE" "PERF_EVENTS_AMD_BRS"
# GPU discreta no presente; Intel HD 630 usa i915
"DRM_NOUVEAU" "DRM_RADEON" "DRM_AMDGPU"
# Ethernet Intel no presente: hardware real es I219-LM/e1000e
# (Cizen-v4 matriz P1).
"E100" "E1000" "IGB" "IGBVF" "IGC" "IXGBE" "IXGBEVF"
"I40E" "I40EVF" "ICE" "FM10K" "IDPF"
