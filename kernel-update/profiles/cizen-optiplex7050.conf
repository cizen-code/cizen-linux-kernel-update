#      dependencia" no lo son, son `tristate "..." if EXPERT` con `default y`
#      dentro de SND_HDA_CODEC_REALTEK y del bloque HDMI (sound/hda/codecs/
#      {realtek,hdmi}/Kconfig). Sin prompt, `scripts/config --disable` se lo
#      come `olddefconfig` y vuelve a =m; con EXPERT=y tienen prompt y la
#      poda pega. v5.12.2 prohibía tocar EXPERT ("apagaría cientos de
#      prompts") — MEDIDO, no es así: contra la base promovida de 7.2.9, el
#      diff de .config con/sin EXPERT cambia solo EXPERT, añade ~40 líneas
#      `# CONFIG_… is not set` (siguen en n: eran prompts que ahora se
#      escriben, no valores) y `ARCH_HAS_ZONE_DMA_SET=y`, que es un mero
#      interruptor (`select … if EXPERT`, arch/x86/Kconfig:113) para el prompt
#      de ZONE_DMA/ZONE_DMA32, que siguen =y. Cero cambios de valor reales.
#   2) Se podan los 14 códecs que no usa este hardware. Realtek: los 9 que no
#      son ALC269 (el ALC3234, Vendor 0x10ec0255 = ALC255, se carga con
#      ALC269, que es el genérico realtek). HDMI: los 5 de GPU ajena
#      (HDMI_SIMPLE/VIA, ATI, NVIDIA, NVIDIA_MCP, TEGRA). `lspci` enseña UNA
#      tarjeta de audio (00:1f.3 [8086:a2f0]) y UNA VGA (Intel HD 630
#      [8086:5912]) y `lsusb` no tiene audio: no hay GPU discreta ni USB
