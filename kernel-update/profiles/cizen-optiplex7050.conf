# ============================================================
# PERFIL CIZEN v5.16.0 — Dell OptiPlex 7050 / i5-7500 / Kaby Lake
# ============================================================
# v5.16.0 (2026-09-29): el usuario elige BORE y renuncia a sched_ext. Se apaga
# BTF entero. Invierte la decision de v5.13.0/v5.14.0, y el motivo es NUEVO:
# no eslahorra de build, es que BORE y sched_ext son excluyentes.
#
# - Hecho: BORE (SCHED_BORE) SUSTITUYE a SCHED_CORE como planificador de nucleo,
#   y sched_ext se engancha precisamente a SCHED_CORE. Con BORE activo no hay
#   punto de anclaje: `sudo scx_bpfland` falla con
#       Error: Failed to load BPF program / No such file or directory (os error 2)
#   Verificado en el kernel arrancado, que tiene las dos opciones a la vez:
#       CONFIG_SCHED_BORE=y   CONFIG_SCHED_CLASS_EXT=y   CONFIG_DEBUG_INFO_BTF=y
#   Asi que BTF no compraba nada utilizable: era el precio de una capacidad
#   inalcanzable. Y ese precio era caro de verdad: el pase de `pahole` sobre
#   el vmlinux se come 6,7 GB de RSS y fue lo que provoco el swapeo y los 34 min
#   del build de pkgrel 9 (ver §36.2 de Agente.md).
#
# - ATENCION, el perfil NO puede apagar BTF por si solo. El motor lo fuerza:
#       kernel-update.sh:1639  add_unique enable "DEBUG_INFO_BTF"   (si BTF_REQUESTED)
#       kernel-update.sh:813   [ "${CIZEN_NO_BTF:-0}" = "1" ] && BTF_REQUESTED=false
#   y el perfil se sourcea en la linea 1515, POSTERIOR a la 813. Poner
#   CIZEN_NO_BTF=1 dentro de este fichero llega tarde y no tiene efecto. El
#   unico mecanismo real es `--no-btf` o CIZEN_NO_BTF=1 en el ENTORNO, antes de
#   arrancar el motor; por eso el perfil lo declara en OPTS_DISABLE, para que
#   olvidar el flag no pase en silencio sino que la validacion lo cante.
#
# - Se retira SCHED_CLASS_EXT de OPTS_ENABLE. Ademas de la exclusion con BORE
#   es IMPOSIBLE mantenerlo: kernel/Kconfig.preempt:171 declara
#       config SCHED_CLASS_EXT
#           depends on BPF_SYSCALL && BPF_JIT && DEBUG_INFO_BTF
#   sin BTF no puede ser =y, asi que dejarlo en OPTS_ENABLE hacia fallar la
#   validacion. Pasa a OPTS_DISABLE, que es su estado real.
# - DEBUG_INFO_REDUCED se activa: sigue habiendo informacion de TIPO (estructuras
#   legibles, backtraces con nombres) pero sin la de variables locales ni lineas
#   de la mayor parte del kernel. Es la parte de DWARF que se puede recortar sin
#   perder la capacidad de inspeccionar el kernel. Ademas empuja BTF a `n` por
#   dependencia (lib/Kconfig.debug:400), asi que refuerza la decision de arriba.
#   OJO: por eso es incompatible con el modo BTF del motor — con BTF activo,
#   REDUCED y DEBUG_INFO_BTF se contradicen y la validacion falla.
# - Se conservan DEBUG_INFO_BTF_MODULES y GDB_SCRIPTS apagados (v5.15.0): ahora
#   son redundantes, porque BTF entero ya no se genera.
# v5.15.0 (2026-09-28): sobre v5.14.0, se aplica la parte que si recorta tiempo
# de compilacion del fichero "Bloques-para-acelerar-la-compilacion.txt", y se
# descarta el resto con motivo (auditado simbolo a simbolo contra 7.2.8):
# - BLOQUE 1 (DEBUG_INFO): NO se aplica entero. DEBUG_INFO=y arrastra BTF, y
#   BTF es requisito de SCHED_CLASS_EXT y de scx-scheds. Ademas la parte de
#   compresion es contradictoria: DEBUG_INFO_COMPRESSED_NONE ya es la opcion
#   activa, y el bloque pide apagar NONE, ZLIB y ZSTD a la vez, dejando la
#   eleccion sin ninguna opcion valida. Se salva lo unico que es seguro:
#   DEBUG_INFO_BTF_MODULES (no lo mira ni el motor ni el verificador) y
#   GDB_SCRIPTS.
#   (v5.16.0 revierte la conclusion de este bloque: BTF si se apaga entero.)
# - BLOQUE 2 (NET_VENDOR_*, 70 simbolos): NO se aplica. Los 70 existen y estan
#   =y, pero --lite es el UNICO modo de la suite (kernel-update.sh:54, no
#   existe --no-lite) y siempre ejecuta make localmodconfig, que ya apago
#   todos los drivers hijos: R8169 is not set, NETXEN_NIC is not set, y solo
#   quedan 129 modulos=m en toda la config. Poner los 70 bools a n solo
#   limpia texto; no ahorra compilacion. La unica NIC es una Intel I219-LM
#   (e1000e), asi que la premisa del bloque era correcta, pero irrelevante.
# - BLOQUE 3 (MFD): ya aplicado en v5.14.0, salvo los GPIO que faltaban.
# ============================================================
# v5.14.0 (2026-09-28): adelgazamiento real, con la decisión BTF resuelta.
# - Se conserva CONFIG_DEBUG_INFO_BTF=y. NO se aplica un "FAST_BUILD" que lo
#   apague: en 7.2.8, kernel/Kconfig.preempt:171 declara
#       config SCHED_CLASS_EXT
#           depends on BPF_SYSCALL && BPF_JIT && DEBUG_INFO_BTF
#   y lib/Kconfig.debug:400 declara
#       config DEBUG_INFO_BTF
#           depends on !DEBUG_INFO_SPLIT && !DEBUG_INFO_REDUCED
#   Es decir: DEBUG_INFO_REDUCED (el acelerador de DWARF) y DEBUG_INFO_SPLIT
#   también matan BTF. No existe "debug rápido Y BTF" en este kernel.
#   Consecuencia: sin BTF cae SCHED_CLASS_EXT, y con él dejan de poder cargarse
#   los schedulers BPF de scx-scheds (scx_bpfland/scx_rusty/scx_lavd/...),
#   que están instalados en el host y son CO-RE. El fallo no aparecería hasta
#   arrancar un scheduler scx, mucho después del build.
#   Además kernel-update-verify.sh:462-467 audita que el BTF del kernel
#   arrancado coincida con la firma del build: apagarlo rompe ese contrato.
#   Para una build rápida puntual existe el opt-out del motor --no-btf
#   (CIZEN_NO_BTF=1), que además exige quitar SCHED_CLASS_EXT de OPTS_ENABLE
#   y asumir que scx-scheds deja de funcionar. Con 11 GiB de RAM el umbral
#   BTF (CIZEN_BUILD_MIN_MEM_BTF_MB=12288) se salva con el swap.
# - NO_LEGACY_SURFACES reducido a lo que realmente queda: PROC_KCORE y DEVMEM.
#   DEVKMEM ya no existe en 7.2 y MODULE_FORCE_LOAD/UNLOAD y
#   FW_LOADER_USER_HELPER ya estaban fuera desde v5.x.
# - ZRAM: cierra el trabajo de v5.10.0. Quedaban LZ4 y 842 activos; con ZSTD
#   como único backend, ZRAM_MULTI_COMP (=y) se queda sin destino real de
#   re-compresión, pero no estorba: solo depende on ZRAM.
# - MFD/PMIC/TWL/Wolfson: 30 drivers built-in (=y) para hardware que este
#   OptiPlex no tiene. Antes solo se apagaban los gates NET_VENDOR_*, que
#  ritten no ahorraban nada porque los drivers ya estaban =n (solo quedan
#   129 símbolos =m en toda la config). Aquí sí se quita código real.
#   MFD_WM831X y MFD_WM8350 son cores ocultos selecteados por sus front-ends
#   I2C/SPI: hay que apagar los front-ends o Kconfig los devuelve.
#   Se conservan MFD_CORE, MFD_SYSCON, MFD_INTEL_LPSS(_PCI) y
#   REGULATOR_NETLINK_EVENTS: son genéricos y los usa el PCH Q270.
# - SATA_MOBILE_LPM_POLICY: 3 (default, ahorro máximo) -> 0. int, range 0 5,
#   depends on SATA_AHCI (drivers/ata/Kconfig:118). En un SSD SATA de
#   escritoriodesktop el ahorro no compensa la latencia de salida de LPM.
# v5.13.0 (2026-09-27): mejoras de velocidad/alto rendimiento.
# - SCHED_CLASS_EXT se reactiva (OPTS_ENABLE): schedulers sched_ext para
#   A/B en caliente (scx_bpfland/rusty/lavd) sin reiniciar.
# - KALLSYMS_ALL y SLAB_MERGE_DEFAULT pasan a OPTS_DISABLE: menos RAM
#   (kallsyms) y caches slab no fusionadas (aislamiento de rendimiento).
# - LTO: lo gestiona el motor (v27.31.45) con el overlay de CIZEN_LLVM_LTO
#   (default thin) junto a clang; el perfil no lo duplica en OPTS_*.
# v5.12.2 (2026-09-25): los 16 símbolos que Kconfig conserva por dependencia
# (codecs HDA ALC26x/ALC88x + HDMI_* , TDX_HOST_SERVICES y
# WATCHDOG_PRETIMEOUT_GOV_SEL) pasan de OPTS_DISABLE a EXPECTED_REBELS: no son
# desactivables (default y/o `depends on` de SND_HDA_CODEC_REALTEK) ymolestar
# en cada build. Solo se absorbe lo que la validación ya demostró; no se toca
# CONFIG_EXPERT (eso apagaría cientos de prompts).
# ENTRADAS que deben estar disponibles. No se fuerza innecesariamente el modo
# (y/m) si Kconfig requiere otra cosa; la validación comprueba y/m.
declare -a OPTS_ENABLE=(
"NO_HZ_IDLE"
"NET_SCH_INGRESS"
"NET_ACT_CSUM"
"I2C_CHARDEV"
"DEFAULT_BBR"
"TCP_CONG_BBR"
"NET_SCH_FQ"
"NET_SCH_DEFAULT"
"CRYPTO_AES_NI_INTEL"
"FAT_FS"
"VFAT_FS"
"BTRFS_FS"
"NTSYNC"
"ZRAM"
"ZSMALLOC"
"CPU_FREQ_GOV_POWERSAVE"
"CPU_FREQ_DEFAULT_GOV_POWERSAVE"
"HZ_1000"
"X86_NATIVE_CPU"
"DEFAULT_FQ"
"KVM_SMM"
"USB_XHCI_HCD"
"USB_STORAGE"
"USB_UAS"
"USB_HID"
"BT_HCIBTUSB"
"SND_HDA_CODEC_ALC269"
"SND_HDA_CODEC_HDMI_INTEL"
"CGROUP_BPF"
"TICK_CPU_ACCOUNTING"
"IRQ_TIME_ACCOUNTING"
"DRM_I915"
"MODULE_SIG_FORCE"
# v5.16.0 (2026-09-29): DEBUG_INFO_REDUCED sustituye al DWARF completo. Se queda
# informacion de TIPO (estructuras legibles, backtraces con nombres de simbolo)
# pero sin variables locales ni numero de linea en la mayor parte del kernel: lo
# que se recorta sin perder la capacidad de inspeccionar el kernel. Es la razon
# de no desactivar DEBUG_INFO entero — medido en §35.8, quitarlo da 20% pero
# deja el kernel opaco. Ademas empuja DEBUG_INFO_BTF a `n` por dependencia
# (lib/Kconfig.debug:400), o sea que refuerza la decision de BTF.
# OJO: es INCOMPATIBLE con el modo BTF del motor. Con BTF_REQUESTED=true el
# motor mete DEBUG_INFO_BTF en su `enable` (kernel-update.sh:1639) y lo marca
# esperado, mientras REDUCED lo apagaria: la validacion falla. Este perfil es,
# por tanto, un perfil SIN BTF y necesita --no-btf / CIZEN_NO_BTF=1.
"DEBUG_INFO_REDUCED"
# v5.16.0 (2026-09-29): SCHED_CLASS_EXT se RETIRA de OPTS_ENABLE y pasa a
# OPTS_DISABLE. El usuario elige BORE, y BORE sustituye a SCHED_CORE, que es
# donde sched_ext se engancha: son excluyentes. Ademas, sin DEBUG_INFO_BTF el
# simbolo no puede ser =y (depends on BPF_SYSCALL && BPF_JIT && DEBUG_INFO_BTF),
# asi que mantenerlo aqui habria hecho fallar la validacion. Pasa a OPTS_DISABLE,
# que es su estado real. Decision del usuario, no una poda.
# (v5.13.0 lo reactivaba para A/B en caliente con scx_bpfland/rusty/lavd; con
#  BORE esa A/B no tiene donde engancharse. Ver cabecera v5.16.0.)
# v5.13.0: sched_ext reactivado (V). Requiere BPF (presente por CGROUP_BPF) y
# BTF; SCHED_EXT es bool y la validacion comprueba =y.
)
# v5.8: añade MODULE_SIG_FORCE — módulos ya firmados sha512/ECDSA, se fuerza la
# verificación de firma en carga (bloquea módulos no firmados; coste ≈ 0).
# v5.10.0 (2026-09-19, decisión del usuario):
# - HZ_1000 en vez de HZ_300 (timers de 1 ms → menor latencia de scheduler en
#   input/audio/gaming; coste despreciable en 4C con NO_HZ_IDLE). Se activa el
#   símbolo HZ_1000 y se fija OPTS_SETVAL["HZ"]="1000"; se retira HZ_1000 de
#   OPTS_DISABLE y HZ_300 de OPTS_ENABLE (exitía en ambos bloques).
# - IRQ_TIME_ACCOUNTING: de OPTS_DISABLE (v5.7.0) a OPTS_ENABLE — contabilidad
#   IRQ por tarea para decisiones EEVDF más finas en desktop.
# - x86-64-v3: NO aplica cambio. Ya compilamos con CONFIG_X86_NATIVE_CPU=y,
#   equivalente a -march=native para la máquina de build, que produce código
#   AVX2/bmi2 (x86-64-v3) o mejor según gcc. Cambiar a GENERIC_CPU3 fijaría
#   -march=x86-64-v3 fijo y perdería scatter de generaciones futuras; native es
#   el superconjunto correcto aquí.
# v5.9: poda de compat de almacenamiento no usada (2026-09-18) — se retiran
# ntfs3, udf, overlayfs, dm-crypt y dm-mod. Verificado en el host: 0 blkid con
# NTFS/LUKS/LVM, sin docker/podman (overlayfs), sin discos UDF. Se conservan
# exfat/vfat (USB Ventoy) e iso9660 (ISO boot/rescate; el booteo desde Ventoy
# no depende de este kernel). Eran módulos m (OPTS_SETVAL) nunca cargados en
# este host: moverlos a OPTS_DISABLE quita disco/initramfs sin coste de runtime.
# v5.4: aplica fase P1 de cizen-v4-matriz-maestra.txt — exclusividad de
# vendor en CPU/KVM/Ethernet, límite de KVM_MAX_NR_VCPUS y retiro de host
# controllers USB legacy (el Q270 no expone EHCI/OHCI/UHCI separado de xHCI).
# v5.3: recupera compatibilidad de escritorio, Wi-Fi de respaldo, cifrado, mandos/MIDI, RAPL y ZRAM multi-comp.
# v5: poda basada en hardware confirmado y uso real del equipo, con compatibilidad adicional solicitada.
# Se eliminan drivers/funciones claramente ajenos al equipo y debug opcional.
# NO se fuerzan fuera RCU, PSI, infraestructura genérica, ATA/BMDMA, CFG80211
# ni WIRELESS: su ahorro es pequeño y el riesgo de compatibilidad es mayor.
# Los host controllers USB legacy sí se retiran desde v5.4 (ver P1 más abajo):
# a diferencia de RCU/PSI/CFG80211, aquí no es "poco ahorro, riesgo alto"
# sino hardware que este chipset concreto no expone.
declare -a OPTS_DISABLE=(
# v5.13.0: RAM/rendimiento. KALLSYMS_ALL solo mete símbolos extra en kallsyms;
# SLAB_MERGE_DEFAULT fusiona caches (ahorra RAM pero mezcla clases de objeto).
# Ningún dependiente los fuerza a =y; si surgiera uno, la validación lo reporta.
"KALLSYMS_ALL"
"SLAB_MERGE_DEFAULT"
# Timer/scheduler no usados como modo de aislamiento
"NO_HZ_FULL"
"SHUFFLE_PAGE_ALLOCATOR"
# v5.13.0: comentado el retiro de SCHED_CLASS_EXT (era v5.3). Se reactiva en
# OPTS_ENABLE para los schedulers sched_ext (scx_bpfland/rusty/lavd): se
# cambian en caliente sin reiniciar, o sea el A/B de rendimiento de la suite.
# Depende de BTF (que queda =y) y BPF (que ya está por CGROUP_BPF/IO_URING_BPF).
# Hardware / plataformas ausentes (confirmado por lspci/lsusb)
"ATH5K_PCI" "NET_FC" "MCTP" "NET_NCSI" "GOOGLE_FIRMWARE" "VGA_SWITCHEROO"
"KVM_XEN" "KVM_HYPERV" "KVM_AMD"
