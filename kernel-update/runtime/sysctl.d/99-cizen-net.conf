# Gestionado por kernel-update (v5.19.0) — fuente en runtime/sysctl.d/ del repo.
# NO editar a mano: el motor compara el contenido y lo sobrescribe en cada build.
#
# Las dos que sí cambian algo en este equipo (medido antes de escribir):
#   net.ipv4.tcp_fastopen    1 -> 3   (cliente+servidor; evita un segundo SYN)
#   net.ipv4.tcp_mtu_probing 0 -> 1   (desatasca rutas con MTU negro, típico
#                                     de PPTP/VPN y de salidas PPPoE)
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

