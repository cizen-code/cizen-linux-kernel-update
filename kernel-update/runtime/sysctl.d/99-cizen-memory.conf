# Gestionado por kernel-update (v5.19.0) —fuente en runtime/sysctl.d/ del repo.
# NO editar a mano: el motor compara el contenido y lo sobrescribe en cada build.
#
# Los tres valores que pedía cambiar el documento maestro y aquí NO se tocan
# están medidos en /etc/sysctl.d/99-optimizaciones.conf, y se quedan ahí:
#   vm.swappiness = 10
#     Medido: con 150 el ZRAM hizo 9.97 GiB de escrituras y devolvió 5.09 GiB
#     de refaults en 8h51m, con 5+ GiB libres. 80 sería un handicap aquí: el sistema
#   vm.vfs_cache_pressure = 100
#   vm.watermark_boost_factor = 0
# Ninguna clave de este fichero se solapa con 99-optimizaciones.conf, así que el
# orden de carga (99-cizen antes que 99-optimizaciones) da igual.
#
# v5.22.0 (2026-10-06): vm.dirty_ratio / vm.dirty_background_ratio salen de
# aquí. Los ratios % sobre 16 GiB eran ~1,6 GiB / ~480 MiB de datos sucios
# acumulados: al volcarlos, el SATA (500 MB/s) satura el bus y dispara la
# latencia de lectura. El procedimiento RT-Lite (§4.2) sustituye el writeback
# por BYTES ABSOLUTOS bajos — 16 MiB de fondo / 64 MiB de límite — y eso vive
# ya en 99-cizen-rt-lite.conf, que carga DESPUÉS que este (orden alfabético:
# "memory" < "rt-lite"). Los ratios se quitan aquí para que solo haya una
# fuente de verdad; si quedaran, la última escritura ganaría igual, pero dos
# ficheros discutiendo sobre el mismo valor es cómo nacen los errores.
vm.watermark_scale_factor = 500

# Revisados y NO añadidos porque el sistema ya está en ese valor: se dejan
# comentados como constancia, no hacen falta.
