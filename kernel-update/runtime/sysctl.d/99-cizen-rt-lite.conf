# Gestionado por kernel-update (v5.22.0) — fuente en runtime/sysctl.d/ del repo.
# NO editar a mano: el motor compara el contenido y lo sobrescribe en cada build.
# Fichero NUEVO en v5.22.0: Fase 3 (runtime) del procedimiento RT-Lite
# (/home/cizen/nuevas-optimizaciones-kernel.txt, §4.2).
#
# Orden de carga (importante): 99-cizen-memory.conf < 99-cizen-rt-lite.conf
# < 99-optimizaciones.conf (orden alfabético; /etc manda sobre /usr/lib).
# Este fichero trae las claves que NO se solapan con 99-optimizaciones.conf,
# cuyos valores MEDIDOS (swappiness=10, vfs_cache_pressure=100,
# watermark_boost_factor=0, page-cluster=0, nmi_watchdog=0) el usuario decidió
# conservar: el §4.2 del documento pedía 80 / 50 / 15000 respectivamente y eso
# revierte mediciones hechas en §16/§38 de Agente.md, así que NO se aplican.
#
# ── Writeback en BYTES ABSOLUTOS (el cambio de fondo de la Fase 3) ──────────
# Los ratios % sobre 16 GiB (dirty_background_ratio=3 → 480 MiB,
# dirty_ratio=10 → 1,6 GiB) dejan acumular datos sucios hasta que el volcado
# satura el bus SATA (500 MB/s) y dispara la latencia de lectura de todo lo
# demás. En bytes bajos la escritura es constante y predecible: 16 MiB de fondo
# y 64 MiB de techo. Los ratios ya no se escriben en ningún fichero (salieron
# de 99-cizen-memory.conf en esta misma versión).
#   Si 16/64 MiB resulta en escrituras demasiado pequeñas y se mide más IOPS
#   de las necesarias, subir a 32/128 MiB (está escrito en el §4.2).
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
# writeback más frecuente y expiración más corta: la cola de suciedad no vive
# tanto tiempo, se vacía en tandas pequeñas.
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 1500
#
# ── Memoria ─────────────────────────────────────────────────────────────────
# Evitar stalls por compactación/THP en 4C/4T: con THP en madvise (cmdline del
# Nivel 2) no hay khugepaged global que acelerar, así que la compactación
# proactiva solo compite con el escritorio y el build.
vm.compaction_proactiveness = 0
# RETIRADO el 2026-10-08 a petición del usuario. Los 128 MiB de suelo duro,
# sumados a watermark_scale_factor=500 (también retirado), hacían
# Σhigh=1743 MiB de reserva contable en si_mem_available() y costaban ~2,5 GiB
# de MemAvailable aparente sin que la RAM la usara nadie. El motivo original
# (ZRAM como único swap: margen antes de que el reclaim toque páginas del
# build) sigue vigente: si hay stalls u OOM en una compilación, restaurar las
# dos líneas. El default lo recalcula el kernel en cada arranque.
# vm.min_free_kbytes = 131072
#
# ── Scheduler / RT ──────────────────────────────────────────────────────────
# Sin bandwidth control RT por cgroups (RT_GROUP_SCHED=n en 7.2.9) las tareas
# RT no se limitan de todos modos; se fija -1 por si algún día se reactiva el
# grupo (nota: en este kernel la clave EXISTE aunque RT_GROUP_SCHED=n, así que
# la línea no da error de sysctl).
kernel.sched_rt_runtime_us = -1
# OJO con el nombre: el documento pide kernel.sched_migration_cost_ns, pero
# ESTE kernel (BORE) no expone esa clave — no está en /proc/sys/kernel/, y
# sysctl -p daría "cannot stat" en cada build. BORE gestiona su migración con
# sched_bore_*, así que la línea queda FUERA a propósito. Si un build vanilla
# la expone, puede volver.
# kernel.sched_migration_cost_ns = 250000   (no existe en 7.2.9-cizen-v3)
# Límite de muestreo de perf al 5% del CPU: equilibrio entre overhead mínimo y
# capturas útiles con `perf record`. Con 1% las sesiones cortas no capturaban
# muestras suficientes. Default upstream: 25%. (Cambiado en v5.23.0 por análisis.)
kernel.perf_cpu_time_max_percent = 5
#
# ── Red: latencia de softirq sobre el I219-LM 1 Gbit ───────────────────────
# Presupuesto de NAPI más corto (128 en vez de 300) con ventana igual de larga
# (4000 µs en vez de 2000): el softirq se devuelve al ksoftirqd con más
# frecuencia, reduciendo el tiempo en el que una interrupción de red retiene a
# un CPU. Es el compromiso latencia/throughput que pide §4.2 para 1 Gbit.
net.core.netdev_budget = 128
net.core.netdev_budget_usecs = 4000
# Anclas BBR + FQ (el Kconfig ya trae DEFAULT_BBR y DEFAULT_FQ, pero
# /usr/lib/sysctl.d/50-default.conf de systemd pone fq_codel en runtime y aquí
# es donde manda /etc): fq es el qdisc que BBR espera para no mezclar flujos.
# tcp_fastopen=3 y tcp_mtu_probing=1 ya están en 99-cizen-net.conf (v5.19.0).
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
